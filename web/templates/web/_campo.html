<div class="campo{% if campo.errors %} campo--erro{% endif %}">
  <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
  {{ campo }}
  {% if campo.help_text %}<small class="campo__ajuda">{{ campo.help_text }}</small>{% endif %}
  {% for erro in campo.errors %}<small class="campo__msg">{{ erro }}</small>{% endfor %}
</div>
