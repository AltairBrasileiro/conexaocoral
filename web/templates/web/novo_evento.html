{% extends "web/app.html" %}
{% block titulo %}Novo evento · Conexão Coral{% endblock %}

{% block conteudo %}
<div class="pagina pagina--formulario">
  <a class="voltar" href="{% url 'web:painel' %}?consulado={{ consulado.pk }}"><span class="icon">arrow_back</span>Painel</a>
  <h1 class="titulo-pagina">Novo evento</h1>
  <p class="apoio">{{ consulado.nome }} · o evento é publicado assim que for criado.</p>

  <form method="post" class="card card--padding formulario" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    {% include "web/_evento_form.html" %}
    <div class="formulario__acoes">
      <a class="botao-texto" href="{% url 'web:painel' %}?consulado={{ consulado.pk }}">Cancelar</a>
      <button type="submit" class="botao botao--compacto">Criar evento</button>
    </div>
  </form>
</div>
{% endblock %}
